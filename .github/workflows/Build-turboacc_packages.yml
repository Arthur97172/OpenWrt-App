name: Build Turboacc Packages

on:
  workflow_dispatch:
  schedule:
    # 北京时间每两天凌晨 2:00 自动触发 (UTC 18:00)
    - cron: '0 18 */2 * *'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.version }} - ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 24.10 版本 ---
          - version: "24.10.6"
            target: "x86/64"
            arch: "x86_64"
          - version: "24.10.6"
            target: "armsr/armv8"
            arch: "aarch64_generic"
          - version: "24.10.6"
            target: "bcm27xx/bcm2710"
            arch: "aarch64_cortex-a53"
            
          # --- 25.12.1 版本 ---
          - version: "25.12.1"
            target: "x86/64"
            arch: "x86_64"
          - version: "25.12.1"
            target: "armsr/armv8"
            arch: "aarch64_generic"
          - version: "25.12.1"
            target: "bcm27xx/bcm2710"
            arch: "aarch64_cortex-a53"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Download & Extract OpenWrt SDK
        run: |
          VER="${{ matrix.version }}"
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"
          
          # 根据版本自动匹配对应的 GCC 版本号
          case "${VER}" in
            "24.10.6")
              GCC_VER="13.3.0"
              ;;
            "25.12.1")
              GCC_VER="14.3.0"
              ;;
            *)
              GCC_VER="14.3.0"
              ;;
          esac
          
          # 根据矩阵中的 target 映射出 SDK 文件名中的架构段（例如 x86/64 -> x86-64）
          case "${TARGET}" in
            "x86/64")
              TARGET_STR="x86-64"
              ;;
            "armsr/armv8")
              TARGET_STR="armsr-armv8"
              ;;
            "bcm27xx/bcm2710")
              TARGET_STR="bcm27xx-bcm2710"
              ;;
            *)
              TARGET_STR=$(echo "${TARGET}" | tr '/' '-')
              ;;
          esac
          
          SDK_FILE="immortalwrt-sdk-${VER}-${TARGET_STR}_gcc-${GCC_VER}_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.immortalwrt.org/releases/${VER}/targets/${TARGET}/${SDK_FILE}"
          
          echo "Downloading SDK from: ${URL}"
          wget -q "${URL}" || { echo "Download failed!"; exit 1; }
          
          tar -xf immortalwrt-sdk-*.tar.*
          rm immortalwrt-sdk-*.tar.*
          mv immortalwrt-sdk-* sdk
          
          cd sdk
          echo ">>> 更新基础 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone TurboACC & Dependencies
        run: |
          set -e
          cd sdk/package

          echo ">>> 克隆 TurboACC 主仓库..."
          git clone --depth=1 https://github.com/chenmozhijin/turboacc tmp_turboacc
          if [ -d "tmp_turboacc/luci-app-turboacc" ]; then
            cp -a tmp_turboacc/luci-app-turboacc ./
          else
            cp -a tmp_turboacc ./luci-app-turboacc
          fi
          rm -rf tmp_turboacc

          echo ">>> 克隆 nft-fullcone 依赖..."
          git clone --depth=1 https://github.com/immortalwrt/packages /tmp/immortalwrt_pkgs
          cp -a /tmp/immortalwrt_pkgs/net/nft-fullcone ./ 2>/dev/null || true
          rm -rf /tmp/immortalwrt_pkgs

          echo ">>> 克隆 iptables-mod-fullconenat 依赖..."
          git clone --depth=1 https://github.com/Lienol/openwrt-package /tmp/lienol_pkgs
          cp -a /tmp/lienol_pkgs/package/iptables-mod-fullconenat ./ 2>/dev/null || true
          rm -rf /tmp/lienol_pkgs

      - name: Configure and Fast Compile Specified Packages
        run: |
          set -e
          cd sdk

          # 写入所需的目标包配置
          echo "CONFIG_PACKAGE_luci-app-turboacc=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn=m" >> .config
          echo "CONFIG_PACKAGE_nft-fullcone=m" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-fullcone=m" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-fullconenat=m" >> .config
          echo "CONFIG_PACKAGE_ip6tables-mod-fullconenat=m" >> .config

          make defconfig
          echo ">>> 开始快速精准编译指定软件包..."

          # 精准编译指定目标（按顺序并行编译，失败时降级单线程）
          make package/luci-app-turboacc/compile V=s -j$(nproc) || make package/luci-app-turboacc/compile V=s -j1
          make package/nft-fullcone/compile V=s -j$(nproc) || make package/nft-fullcone/compile V=s -j1
          
          # 仅当 iptables-mod-fullconenat 源码存在时编译
          if [ -d "package/iptables-mod-fullconenat" ]; then
            make package/iptables-mod-fullconenat/compile V=s -j$(nproc) || make package/iptables-mod-fullconenat/compile V=s -j1
          fi

      - name: Organize Packages
        run: |
          ARCH="${{ matrix.arch }}"
          
          mkdir -p output/apk/${ARCH}/turboacc
          mkdir -p output/ipk/${ARCH}/turboacc

          echo "=== 提取指定编译产物 ==="
          find sdk/bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) | while read -r f; do
            filename=$(basename "$f")
            
            # 严格筛选目标包：turboacc, fullcone, fullconenat
            if [[ "$filename" == *"turboacc"* || "$filename" == *"fullcone"* ]]; then
              if [[ "$f" == *.apk ]]; then
                cp -v "$f" output/apk/${ARCH}/turboacc/
              elif [[ "$f" == *.ipk ]]; then
                cp -v "$f" output/ipk/${ARCH}/turboacc/
              fi
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turboacc-${{ matrix.version }}-${{ matrix.arch }}
          path: output/

  commit:
    name: Commit & Push Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Merge and Clean Files
        run: |
          mkdir -p apk/x86_64/turboacc apk/aarch64_cortex-a53/turboacc apk/aarch64_generic/turboacc
          mkdir -p ipk/x86_64/turboacc ipk/aarch64_cortex-a53/turboacc ipk/aarch64_generic/turboacc

          cp -rn downloaded-artifacts/*/* . || true
          rm -rf downloaded-artifacts

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add apk/ ipk/

          if git diff --staged --quiet; then
            echo "没有检测到文件更改，跳过提交"
          else
            git diff --staged --stat
            git commit -m "自动同步 TurboACC 纯净中文版组件 - $(date +'%Y-%m-%d %H:%M:%S')"
            
            git pull --rebase origin main || git rebase --abort
            git push origin main
          fi
