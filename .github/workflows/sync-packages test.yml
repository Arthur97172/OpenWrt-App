name: Sync OpenWrt Packages Test

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and poweroff packages
        run: |
          RESPONSE=$(curl -sL "https://api.github.com/repos/Arthur97172/luci-app-poweroff/releases/latest")

          mkdir -p apk/x86_64/poweroff apk/aarch64_cortex-a53/poweroff apk/aarch64_generic/poweroff
          mkdir -p ipk/x86_64/poweroff ipk/aarch64_cortex-a53/poweroff ipk/aarch64_generic/poweroff
          rm -f apk/*/poweroff/* ipk/*/poweroff/* 2>/dev/null || true

          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== poweroff $arch ==="

            # 通用的 apk
            for url in $(echo "$RESPONSE" | jq -r '.assets[] | select(.name | test("luci-.*\\.apk$")) | .browser_download_url'); do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                filename=$(basename "$url" | sed 's/_all\./\./')
                curl -sL "$url" -o "apk/$arch/poweroff/$filename" 2>/dev/null && echo "  APK: $filename"
              fi
            done

            # 通用的 ipk (_all 格式)
            for url in $(echo "$RESPONSE" | jq -r '.assets[] | select(.name | test("_all\\.ipk$")) | .browser_download_url'); do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                filename=$(basename "$url" | sed 's/_all\./\./')
                curl -sL "$url" -o "ipk/$arch/poweroff/$filename" 2>/dev/null && echo "  IPK: $filename"
              fi
            done
          done
 
      - name: Commit and push changes
        run: |
          # 过滤非 zh-cn 语言包（做双重保险，清除意外混入的非中文包）
          echo "=== 过滤语言包 ==="
          for dir in apk/*/* ipk/*/*; do
            [ -d "$dir" ] || continue
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              if [[ $(basename "$file") == luci-i18n-* ]] && [[ ! $(basename "$file") =~ -zh-cn ]]; then
                rm -f "$file"
                echo "  删除非中文语言包: $(basename "$file")"
              fi
            done
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
            else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              git pull --rebase origin main || git rebase --abort
              git push origin main
            fi
