name: Sync OpenWrt Packages Test

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日凌晨3点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download and sync adguardhome packages
        run: |
          # 1. 加上鉴权请求头，获取最新的 Release JSON
          RESPONSE=$(curl -sL \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/MomoFlora/luci-app-adguardhome/releases/latest")

          # 核心预检：如果 API 失败，提前拦截，防止 jq 报错崩溃
          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e '.assets' >/dev/null 2>&1; then
            echo "❌ 错误: 无法获取合法的 Release 数据，可能触发了限流或仓库路径不正确！"
            echo "$RESPONSE" | head -n 5
            exit 1
          fi

          # 2. 统一初始化目录
          mkdir -p apk/x86_64/adguardhome apk/aarch64_cortex-a53/adguardhome apk/aarch64_generic/adguardhome
          mkdir -p ipk/x86_64/adguardhome ipk/aarch64_cortex-a53/adguardhome ipk/aarch64_generic/adguardhome
          rm -f apk/*/adguardhome/* ipk/*/adguardhome/* 2>/dev/null || true

          # ==================== 1. 处理 APK (寻找包含架构名的归档包) ====================
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== adguardhome APK $arch ==="
            
            # 使用 --arg 优雅传参，避开 Shell 转义。匹配：以 架构名 开头，且以 .tar.gz 或 .zip 结尾的文件
            URL=$(echo "$RESPONSE" | jq -r --arg arch "$arch" '.assets[] | select(.name | test("^" + $arch + "\\.(tar\\.gz|zip)$")) | .browser_download_url' 2>/dev/null)

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              TEMP_DIR=$(mktemp -d)
              FILE_NAME=$(basename "$URL")
              curl -sL "$URL" -o "$TEMP_DIR/$FILE_NAME" 2>/dev/null || true
              
              # 【智能解压】根据后缀自动选择 tar 或 unzip
              if [[ "$FILE_NAME" == *.tar.gz ]]; then
                tar -xzf "$TEMP_DIR/$FILE_NAME" -C "$TEMP_DIR" 2>/dev/null || true
              elif [[ "$FILE_NAME" == *.zip ]]; then
                unzip -q "$TEMP_DIR/$FILE_NAME" -d "$TEMP_DIR" 2>/dev/null || true
              fi
              
              # 穿透捞出 .apk 文件
              find "$TEMP_DIR" -name "*.apk" -exec mv {} "apk/$arch/adguardhome/" \; 2>/dev/null || true
              ls "apk/$arch/adguardhome/" 2>/dev/null | head -5 || echo "  (目录为空)"
              rm -rf "$TEMP_DIR" 2>/dev/null || true
            else
              echo "  未找到 APK 归档包"
            fi
          done

          # ==================== 2. 处理 IPK (寻找格式如 openwrt-24.10-架构.tar.gz/.zip) ====================
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== adguardhome IPK $arch ==="
            
            # 使用 --arg 匹配：以 openwrt-24.10-架构名 开头，且以 .tar.gz 或 .zip 结尾的文件
            URL=$(echo "$RESPONSE" | jq -r --arg arch "$arch" '.assets[] | select(.name | test("^openwrt-24\\.10-" + $arch + "\\.(tar\\.gz|zip)$")) | .browser_download_url' 2>/dev/null)

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              TEMP_DIR=$(mktemp -d)
              FILE_NAME=$(basename "$URL")
              curl -sL "$URL" -o "$TEMP_DIR/$FILE_NAME" 2>/dev/null || true
              
              # 【智能解压】根据后缀自动选择 tar 或 unzip
              if [[ "$FILE_NAME" == *.tar.gz ]]; then
                tar -xzf "$TEMP_DIR/$FILE_NAME" -C "$TEMP_DIR" 2>/dev/null || true
              elif [[ "$FILE_NAME" == *.zip ]]; then
                unzip -q "$TEMP_DIR/$FILE_NAME" -d "$TEMP_DIR" 2>/dev/null || true
              fi
              
              # 穿透捞出 .ipk 文件
              find "$TEMP_DIR" -name "*.ipk" -exec mv {} "ipk/$arch/adguardhome/" \; 2>/dev/null || true
              ls "ipk/$arch/adguardhome/" 2>/dev/null | head -5 || echo "  (目录为空)"
              rm -rf "$TEMP_DIR" 2>/dev/null || true
            else
              echo "  未找到 IPK 归档包"
            fi
          done
 
      - name: Commit and push changes
        run: |
          # 过滤非 zh-cn 语言包
          echo "=== 过滤语言包 ==="
          for dir in apk/*/* ipk/*/*; do
            [ -d "$dir" ] || continue
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              # 删除 luci-i18n 开头的非 zh-cn 语言包
              if [[ $(basename "$file") == luci-i18n-* ]] && [[ ! $(basename "$file") =~ -zh-cn ]]; then
                rm -f "$file"
                echo "  删除: $(basename "$file")"
              fi
            done
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
            else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              # === 关键修复步骤 ===
              # 1. 尝试拉取远程最新代码并变基，如果因为冲突失败则取消变基
              git pull --rebase origin main || git rebase --abort
              
              # 2. 重新推送
              git push origin main
            fi
