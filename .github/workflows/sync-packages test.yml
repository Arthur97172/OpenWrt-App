name: Sync OpenWrt Packages Test

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日凌晨3点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download and sync adguardhome packages
        run: |
          # 1. 统一创建目录并初始化（只在这里清空一次，防止后面的下载被覆盖删除）
          mkdir -p apk/x86_64/adguardhome apk/aarch64_cortex-a53/adguardhome apk/aarch64_generic/adguardhome
          mkdir -p ipk/x86_64/adguardhome ipk/aarch64_cortex-a53/adguardhome ipk/aarch64_generic/adguardhome
          rm -f apk/*/adguardhome/* ipk/*/adguardhome/* 2>/dev/null || true

          # ==========================================
          # 第一部分：获取 openwrt-adguardhome 仓库最新包
          # ==========================================
          echo ">>> 正在同步 openwrt-adguardhome 仓库..."
          RESPONSE1=$(curl -sL "https://api.github.com/repos/xiaoxiao29/luci-app-adguardhome/releases/latest")

          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== adguardhome(1) $arch ==="

            # 架构特定的 apk (25.12+)
            for arch_variant in "$arch"; do
              for url in $(echo "$RESPONSE1" | jq -r --arg av "$arch_variant" '.assets[] | select(.name | contains($av) and contains(".apk")) | .browser_download_url'); do
                if [ -n "$url" ] && [ "$url" != "null" ]; then
                  ORIG_NAME=$(basename "$url")
                  [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
                  curl -sL "$url" -o "apk/$arch/adguardhome/$FILE_NAME" 2>/dev/null && echo "  APK: $FILE_NAME"
                fi
              done
            done

            # 通用的 apk (25.12+ 且没有架构后的通用包)
            for url in $(echo "$RESPONSE1" | jq -r '.assets[] | select(.name | test("^25\\.12\\+.*\\.apk$")) | .browser_download_url'); do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                ORIG_NAME=$(basename "$url")
                [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
                curl -sL "$url" -o "apk/$arch/adguardhome/$FILE_NAME" 2>/dev/null && echo "  APK: $FILE_NAME"
              fi
            done

            # 通用的 apk (_all 格式) (25.12+)
            for url in $(echo "$RESPONSE1" | jq -r '.assets[] | select(.name | test("_all\\.apk$") and contains("25.12")) | .browser_download_url'); do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                ORIG_NAME=$(basename "$url")
                [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
                curl -sL "$url" -o "apk/$arch/adguardhome/$FILE_NAME" 2>/dev/null && echo "  APK: $FILE_NAME"
              fi
            done

            # 架构特定的 ipk (24.10)
            for arch_variant in "$arch"; do
              for url in $(echo "$RESPONSE1" | jq -r --arg av "$arch_variant" '.assets[] | select(.name | contains($av) and contains("24.10") and endswith(".ipk")) | .browser_download_url'); do
                if [ -n "$url" ] && [ "$url" != "null" ]; then
                  ORIG_NAME=$(basename "$url")
                  [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
                  curl -sL "$url" -o "ipk/$arch/adguardhome/$FILE_NAME" 2>/dev/null && echo "  IPK: $FILE_NAME"
                fi
              done
            done

            # 通用的 ipk (_all 格式) (24.10)
            for url in $(echo "$RESPONSE1" | jq -r '.assets[] | select(.name | test("_all\\.ipk$") and contains("24.10")) | .browser_download_url'); do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                ORIG_NAME=$(basename "$url")
                [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
                curl -sL "$url" -o "ipk/$arch/adguardhome/$FILE_NAME" 2>/dev/null && echo "  IPK: $FILE_NAME"
              fi
            done
          done

          
      - name: Commit and push changes
        run: |
          # 过滤非 zh-cn 语言包
          echo "=== 过滤语言包 ==="
          for dir in apk/*/* ipk/*/*; do
            [ -d "$dir" ] || continue
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              # 删除 luci-i18n 开头的非 zh-cn 语言包
              if [[ $(basename "$file") == luci-i18n-* ]] && [[ ! $(basename "$file") =~ -zh-cn ]]; then
                rm -f "$file"
                echo "  删除: $(basename "$file")"
              fi
            done
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
            else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              # === 关键修复步骤 ===
              # 1. 尝试拉取远程最新代码并变基，如果因为冲突失败则取消变基
              git pull --rebase origin main || git rebase --abort
              
              # 2. 重新推送
              git push origin main
            fi
