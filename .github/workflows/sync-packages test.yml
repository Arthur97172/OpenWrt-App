name: Sync OpenWrt Packages Test

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日凌晨3点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and sync watchdog packages
        run: |
          RESPONSE=$(curl -sL "https://api.github.com/repos/sirpdboy/luci-app-watchdog/releases/latest")

          mkdir -p apk/x86_64/watchdog apk/aarch64_cortex-a53/watchdog apk/aarch64_generic/watchdog
          mkdir -p ipk/x86_64/watchdog ipk/aarch64_cortex-a53/watchdog ipk/aarch64_generic/watchdog
          rm -f apk/*/taskplan/* ipk/*/taskplan/* 2>/dev/null || true

          # 下载并解压 apk (SNAPSHOT.tar.gz) - 文件名格式: SNAPSHOT-x86_64.tar.gz, 里面是 apk 文件
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== watchdog APK $arch ==="
            TARGZ_URL=$(echo "$RESPONSE" | jq -r ".assets[] | select(.name | test(\"^SNAPSHOT-${arch}\\\\.tar\\\\.gz$\")) | .browser_download_url")

            if [ -n "$TARGZ_URL" ] && [ "$TARGZ_URL" != "null" ]; then
              TEMP_DIR=$(mktemp -d)
              curl -sL "$TARGZ_URL" -o "$TEMP_DIR/watchdog.tar.gz" 2>/dev/null || true
              tar -xzf "$TEMP_DIR/watchdog.tar.gz" -C "$TEMP_DIR" 2>/dev/null || true
              find "$TEMP_DIR" -name "*.apk" -exec mv {} "apk/$arch/watchdog/" \; 2>/dev/null || true
              ls "apk/$arch/watchdog/" 2>/dev/null | head -5 || echo "  (目录为空)"
              rm -rf "$TEMP_DIR" 2>/dev/null || true
            else
              echo "  未找到 APK"
            fi
          done

          # 下载并解压 ipk (openwrt-24.10.tar.gz) - 里面是 ipk 文件
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== watchdog IPK $arch ==="
            TARGZ_URL=$(echo "$RESPONSE" | jq -r ".assets[] | select(.name | test(\"^openwrt-24\\\\.10-${arch}\\\\.tar\\\\.gz$\")) | .browser_download_url")

            if [ -n "$TARGZ_URL" ] && [ "$TARGZ_URL" != "null" ]; then
              TEMP_DIR=$(mktemp -d)
              curl -sL "$TARGZ_URL" -o "$TEMP_DIR/watchdog.tar.gz" 2>/dev/null || true
              tar -xzf "$TEMP_DIR/watchdog.tar.gz" -C "$TEMP_DIR" 2>/dev/null || true
              find "$TEMP_DIR" -name "*.ipk" -exec mv {} "ipk/$arch/watchdog/" \; 2>/dev/null || true
              ls "ipk/$arch/watchdog/" 2>/dev/null | head -5 || echo "  (目录为空)"
              rm -rf "$TEMP_DIR" 2>/dev/null || true
            else
              echo "  未找到 IPK"
            fi
          done

      - name: Download and sync adguardhome packages
        run: |
          echo ">>> 正在同步 openwrt-adguardhome 仓库..."

          # ==================== 1. 获取最新 Release ====================
          RESPONSE_CORE=$(curl -sL -H "User-Agent: OpenWrt-Sync-Script" \
            "https://api.github.com/repos/MomoFlora/luci-app-adguardhome/releases/latest")

          # 核心安全预检
          if [ -z "$RESPONSE_CORE" ] || [ "$RESPONSE_CORE" = "null" ]; then
            echo "❌ 错误: curl 返回空，可能网络问题"
            exit 1
          fi

          if ! echo "$RESPONSE_CORE" | jq -e '.assets' >/dev/null 2>&1; then
            echo "❌ 错误: 无法获取合法的 Release 数据，可能触发了限流或仓库路径不正确！"
            echo "$RESPONSE_CORE" | head -n 15
            exit 1
          fi

          echo "✅ 成功获取 Release 数据"

          # 2. 统一初始化目录
          mkdir -p apk/x86_64/adguardhome \
                  apk/aarch64_cortex-a53/adguardhome \
                  apk/aarch64_generic/adguardhome

          mkdir -p ipk/x86_64/adguardhome \
                  ipk/aarch64_cortex-a53/adguardhome \
                  ipk/aarch64_generic/adguardhome

          rm -f apk/*/adguardhome/* ipk/*/adguardhome/* 2>/dev/null || true

          # ==================== 3. 处理 APK (25.12 方案) ====================
          echo "=== 处理 APK (25.12) ==="
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== adguardhome APK $arch ==="

            URL=$(echo "$RESPONSE_CORE" | jq -r --arg arch "$arch" '
              .assets[] | select(.name == ($arch + "-openwrt-25.12.tar.gz")) | .browser_download_url
            ' 2>/dev/null)

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "  下载: $URL"
              TEMP_DIR=$(mktemp -d)
              curl -sL -H "User-Agent: OpenWrt-Sync-Script" "$URL" -o "$TEMP_DIR/adguardhome_apk.tar.gz"

              if tar -xzf "$TEMP_DIR/adguardhome_apk.tar.gz" -C "$TEMP_DIR" 2>/dev/null; then
                find "$TEMP_DIR" -name "*.apk" -exec mv {} "apk/$arch/adguardhome/" \; 2>/dev/null || true
                echo "  提取完成: $(ls "apk/$arch/adguardhome/" 2>/dev/null | wc -l) 个 .apk 文件"
              else
                echo "  解压失败"
              fi
              rm -rf "$TEMP_DIR"
            else
              echo "  未找到 APK 归档包"
            fi
          done

          # ==================== 4. 处理 IPK (24.10 方案) ====================
          echo "=== 处理 IPK (24.10) ==="
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            echo "=== adguardhome IPK $arch ==="

            URL=$(echo "$RESPONSE_CORE" | jq -r --arg arch "$arch" '
              .assets[] | select(.name == ($arch + "-openwrt-24.10.tar.gz")) | .browser_download_url
            ' 2>/dev/null)

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "  下载: $URL"
              TEMP_DIR=$(mktemp -d)
              curl -sL -H "User-Agent: OpenWrt-Sync-Script" "$URL" -o "$TEMP_DIR/adguardhome_ipk.tar.gz"

              if tar -xzf "$TEMP_DIR/adguardhome_ipk.tar.gz" -C "$TEMP_DIR" 2>/dev/null; then
                find "$TEMP_DIR" -name "*.ipk" -exec mv {} "ipk/$arch/adguardhome/" \; 2>/dev/null || true
                echo "  提取完成: $(ls "ipk/$arch/adguardhome/" 2>/dev/null | wc -l) 个 .ipk 文件"
              else
                echo "  解压失败"
              fi
              rm -rf "$TEMP_DIR"
            else
              echo "  未找到 IPK 归档包"
            fi
          done
 
      - name: Commit and push changes
        run: |
          # 过滤非 zh-cn 语言包（做双重保险，清除意外混入的非中文包）
          echo "=== 过滤语言包 ==="
          for dir in apk/*/* ipk/*/*; do
            [ -d "$dir" ] || continue
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              if [[ $(basename "$file") == luci-i18n-* ]] && [[ ! $(basename "$file") =~ -zh-cn ]]; then
                rm -f "$file"
                echo "  删除非中文语言包: $(basename "$file")"
              fi
            done
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
            else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              git pull --rebase origin main || git rebase --abort
              git push origin main
            fi
