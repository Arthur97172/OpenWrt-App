name: Sync Sing-Box Packages

on:
  schedule:
    - cron: '0 18 */3 * *'  # 每3日凌晨2点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and sync sing-box packages
        run: |
          mkdir -p apk/x86_64/sing-box apk/aarch64_cortex-a53/sing-box apk/aarch64_generic/sing-box
          mkdir -p ipk/x86_64/sing-box ipk/aarch64_cortex-a53/sing-box ipk/aarch64_generic/sing-box
          rm -f apk/*/sing-box/* ipk/*/sing-box/* 2>/dev/null || true

          echo "=== sing-box Packages ==="
          RELEASE=$(curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/latest")
          
          # 遍历所有下载资产
          echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith(".apk") or endswith(".ipk")) | .browser_download_url' | while read -r url; do
            [ -z "$url" ] && continue
            filename=$(basename "$url")
            
            # 根据文件名中的特征匹配对应的架构目录
            if [[ "$filename" == *"openwrt_x86_64"* ]]; then
              arch="x86_64"
            elif [[ "$filename" == *"openwrt_aarch64_cortex-a53"* ]]; then
              arch="aarch64_cortex-a53"
            elif [[ "$filename" == *"openwrt_aarch64_generic"* ]]; then
              arch="aarch64_generic"
            else
              # 如果有其他架构或者不需要的包，跳过
              continue
            fi
            
            # 判断是 apk 还是 ipk 并下载到对应文件夹
            if [[ "$filename" == *.apk ]]; then
              curl -sL "$url" -o "apk/$arch/sing-box/$filename"
              echo "  下载 APK [$arch]: $filename"
            elif [[ "$filename" == *.ipk ]]; then
              curl -sL "$url" -o "ipk/$arch/sing-box/$filename"
              echo "  下载 IPK [$arch]: $filename"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "没有检测到文件更改，跳过提交"
          else
            git diff --staged --stat
            git commit -m "自动同步 sing-box 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push || true
          fi
